# Teleprompter landing — static site.
# HTTP only for now; run `sudo certbot --nginx -d teleprompter.sandboxlabs.uk`
# once DNS points here and certbot will add the 443 block + redirect.
server {
    listen 80;
    server_name teleprompter.sandboxlabs.uk;

    root /var/www/teleprompter;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location /downloads/ {
        add_header Content-Disposition "attachment";
        add_header Cache-Control "public, max-age=86400";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
